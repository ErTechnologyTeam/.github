# KULLANIMDAN KALDIRILDI (CI maliyeti).
#
# Eskiden kaynak repolardaki trigger-docs.yml bu iş akışını çağırır, o da ErTechnologyTeam/cibik-docs'a
# repository_dispatch gönderirdi (her push'ta docs yeniden derleniyordu). Artık cibik-docs "Deploy Docs"
# günde bir kez (gece 03:00 TR) ve elle çalışır; kaynak repoları baştan çekip her ortam dalını okur,
# yani değişiklikler kendiliğinden birikir.
#
# Bu dosya yalnız staging/production dallarındaki eski trigger-docs.yml kopyaları (henüz promosyonla
# kalkmadı) hata vermesin diye duruyor. İş her zaman atlanır, atlanan iş ücret yazmaz.
# Tüm dallardan trigger-docs.yml kalkınca bu dosya da silinebilir.

name: Central Docs Trigger

on:
  workflow_call:
    inputs:
      source:
        description: "Kullanılmıyor (geriye dönük uyumluluk)"
        required: false
        type: string
    secrets:
      APP_ID:
        required: false
      PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  deprecated:
    name: Kullanımdan kaldırıldı
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo "Docs dağıtımı artık günde bir kez (cibik-docs schedule)."
