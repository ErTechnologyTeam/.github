name: Central Release Please

on:
  workflow_call:
    inputs:
      release_type:
        description: 'Release Please stratejisi (simple veya node)'
        required: true
        type: string
      target_branch:
        description: 'Sürüm çıkarılacak hedef dal'
        required: false
        type: string
        default: 'production'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    name: Release Please (${{ inputs.release_type }})
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: 1. GitHub App Token Üret (cibik-release-bot)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: 2. Release Please Çalıştır
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-type: ${{ inputs.release_type }}
          target-branch: ${{ inputs.target_branch }}

      - name: 3. Otomatik Back-Merge (production -> staging & development)
        # Sadece yeni bir sürüm (Release) yayınlandığında çalışır!
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "🔄 Yeni sürüm (${{ steps.release.outputs.tag_name }}) alt dallara eşitleniyor..."
          
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" repo
          cd repo
          
          git config user.name "cibik-release-bot[bot]"
          git config user.email "cibik-release-bot[bot]@users.noreply.github.com"

          for BRANCH in staging development; do
            echo "👉 Hedef dal: $BRANCH"
            git checkout "$BRANCH"
            
            # [skip ci] sayesinde staging ve dev'de gereksiz Docker build tetiklenmez
            if git merge "origin/${{ inputs.target_branch }}" --no-ff -m "chore(release): sync ${{ steps.release.outputs.tag_name }} back to ${BRANCH} [skip ci]"; then
              git push origin "$BRANCH"
              echo "✅ $BRANCH dalı başarıyla güncellendi!"
            else
              echo "⚠️ $BRANCH dalında çakışma (conflict) var! Otomatik PR açılıyor..."
              git merge --abort
              gh pr create \
                --base "$BRANCH" \
                --head "${{ inputs.target_branch }}" \
                --title "chore(release): sync ${{ steps.release.outputs.tag_name }} to ${BRANCH}" \
                --body "Otomatik geri eşitleme sırasında çakışma tespit edildi. Lütfen çakışmayı çözerek **Create a merge commit** ile birleştirin." || true
            fi
          done
