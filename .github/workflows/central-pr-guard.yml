name: Central PR Guard

on:
  workflow_call:
    inputs:
      check_ef_migrations:
        description: 'EF Core Migration kontrolü yapılsın mı?'
        required: false
        type: boolean
        default: false
      migrations_path:
        description: 'EF Core Migrations klasör yolu'
        required: false
        type: string
        default: ''

jobs:
  pr-policy-check:
    name: PR Başlık ve Şablon Kontrolü
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: 1. Release Please Bot PR'larını Atla
        if: startsWith(github.head_ref, 'release-please--')
        run: echo "Release Please PR'ı doğrulamadan muaf."

      - name: 2. Conventional Commit PR Başlığı Kontrolü (development için)
        id: title_check
        if: github.base_ref == 'development' && !startsWith(github.head_ref, 'release-please--')
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false

      - name: 3. PR Şablonu (Body) Kontrolü
        id: body_check
        if: github.base_ref == 'development' && !startsWith(github.head_ref, 'release-please--')
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! echo "$PR_BODY" | grep -q "## Özet"; then
            echo "❌ HATA: Lütfen PR şablonundaki '## Özet' bölümünü silmeden doldurun!"
            exit 1
          fi
          if ! echo "$PR_BODY" | grep -q "## Risk ve Geri Alma Planı"; then
            echo "❌ HATA: Lütfen PR şablonundaki '## Risk ve Geri Alma Planı' bölümünü silmeden doldurun!"
            exit 1
          fi
          echo "✅ PR şablonu eksiksiz."

      - name: 4. Hata Varsa PR'ı Draft Yap (Merge Butonunu Kilitle)
        if: failure() && github.base_ref == 'development' && !startsWith(github.head_ref, 'release-please--')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔒 Kontroller başarısız olduğu için PR taslak (Draft) moduna alınıyor..."
          gh pr ready ${{ github.event.pull_request.number }} --repo${{ github.repository }} --undo || echo "Draft yapılamadı"

      - name: 5. Kontroller Geçtiyse Kilidi Aç (Ready for Review)
        if: success() && github.base_ref == 'development' && !startsWith(github.head_ref, 'release-please--')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.pull_request.draft }}" == "true" ]; then
            echo "🔓 Tüm kontroller başarılı! PR kilidi açılıyor..."
            gh pr ready ${{ github.event.pull_request.number }} --repo${{ github.repository }} || echo "Kilit açılamadı"
          fi

      - name: 6. Merge Yöntemi Rehberi
        if: always()
        run: |
          if [ "${{ github.base_ref }}" == "development" ]; then
            echo "### 🟢 Hedef Dal: \`development\`" >> $GITHUB_STEP_SUMMARY
            echo "Lütfen birleştirirken **Squash and merge** butonunu kullanın!" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🟠 Hedef Dal: \`${{ github.base_ref }}\` (Ortam Geçişi)" >> $GITHUB_STEP_SUMMARY
            echo "Sürüm geçmişinin (feat/fix) kaybolmaması için lütfen **Create a merge commit** butonunu kullanın! **KESİNLİKLE SQUASH YAPMAYIN!**" >> $GITHUB_STEP_SUMMARY
          fi

  ef-migration-guard:
    name: EF Core Immutable Migration Guard
    if: github.event.action != 'closed' && inputs.check_ef_migrations == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Eski Migration Dosyalarını Kontrol Et
        run: |
          MIGRATIONS_PATH="${{ inputs.migrations_path }}"
          BASE_REF="origin/${{ github.base_ref }}"

          DIFF_OUTPUT=$(git diff --name-status "$BASE_REF"...HEAD -- "$MIGRATIONS_PATH")

          if [ -z "$DIFF_OUTPUT" ]; then
            echo "✅ Migration klasöründe hiçbir değişiklik yok."
            exit 0
          fi

          NEW_MIGRATION_ADDED=false
          SNAPSHOT_CHANGED=false
          VIOLATION=false

          while IFS=$'\t' read -r STATUS FILE1 FILE2; do
            if [[ "$FILE1" == *ModelSnapshot.cs ]]; then
              SNAPSHOT_CHANGED=true
              continue
            fi
            if [[ "$STATUS" == "A" ]]; then
              if [[ "$FILE1" == *.cs && "$FILE1" != *.Designer.cs ]]; then
                NEW_MIGRATION_ADDED=true
              fi
            else
              echo "❌ HATA: Mevcut bir migration dosyası değiştirilemez veya silinemez: ($STATUS)$FILE1"
              VIOLATION=true
            fi
          done <<< "$DIFF_OUTPUT"

          if [ "$SNAPSHOT_CHANGED" = true ] && [ "$NEW_MIGRATION_ADDED" = false ]; then
            echo "❌ HATA: Yeni bir migration eklenmeden ModelSnapshot değiştirilemez!"
            VIOLATION=true
          fi

          if [ "$VIOLATION" = true ]; then
            exit 1
          fi
          echo "✅ Migration kuralları doğrulandı."

  auto-delete-branch:
    name: Geçici Dalı Temizle
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Korumalı Ana Dal Değilse Sil
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          case "$HEAD_BRANCH" in
            development|staging|production)
              echo "🛡️ '$HEAD_BRANCH' korumalı ana daldır, silinmeden bırakılıyor."
              exit 0
              ;;
            *)
              echo "🧹 Birleştirilen geçici dal siliniyor: $HEAD_BRANCH"
              gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${HEAD_BRANCH}" || echo "Dal zaten silinmiş"
              ;;
          esac
